name: Mirror releases and update source

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate config and create app matrix
        id: matrix
        run: |
          python update.py --validate-only
          echo "matrix=$(jq -c '[.apps | to_entries[] | .value + {key: .key}]' config.json)" >> "$GITHUB_OUTPUT"

  mirror:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.app.runner }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      APP_KEY: ${{ matrix.app.key }}
      APP_NAME: ${{ matrix.app.app_name }}
      UPSTREAM_REPOSITORY: ${{ matrix.app.repo_url }}
      TRANSFORMATION: ${{ matrix.app.transformation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Find latest stable upstream release
        id: release
        run: |
          gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" | python mirror.py select

      - name: Check whether release is already mirrored
        id: check
        env:
          MIRROR_TAG: ${{ steps.release.outputs.mirror_tag }}
          OUTPUT_NAME: ${{ steps.release.outputs.output_name }}
        run: python mirror.py check

      - name: Download upstream IPA
        if: steps.check.outputs.should_mirror == 'true'
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
        run: curl -fL --retry 3 --retry-all-errors "$ASSET_URL" -o upstream.ipa

      - name: Build mirrored IPA
        if: steps.check.outputs.should_mirror == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OUTPUT_NAME: ${{ steps.release.outputs.output_name }}
        run: |
          if [[ "$TRANSFORMATION" == "none" ]]; then
            cp upstream.ipa "$OUTPUT_NAME"
            exit 0
          fi

          if [[ "$TRANSFORMATION" != "apollo_bundle_versions" ]]; then
            echo "Unknown transformation: $TRANSFORMATION"
            exit 1
          fi

          mkdir build
          cd build
          unzip -q ../upstream.ipa
          app_path=$(find Payload -maxdepth 1 -type d -name "*.app" -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found in upstream IPA."
            exit 1
          fi

          plist="${app_path}/Info.plist"
          plist_set_or_add() {
            local key="$1"
            local value="$2"
            if /usr/libexec/PlistBuddy -c "Print :${key}" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$plist"
            else
              /usr/libexec/PlistBuddy -c "Add :${key} string ${value}" "$plist"
            fi
          }
          plist_set_or_add CFBundleVersion "$VERSION"
          plist_set_or_add CFBundleShortVersionString "$VERSION"
          zip -6 -rq "../$OUTPUT_NAME" Payload -x "*/.*"

      - name: Create or repair mirrored release
        if: steps.check.outputs.should_mirror == 'true'
        env:
          MIRROR_TAG: ${{ steps.release.outputs.mirror_tag }}
          OUTPUT_NAME: ${{ steps.release.outputs.output_name }}
          RELEASE_EXISTS: ${{ steps.check.outputs.release_exists }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_ASSET: ${{ steps.release.outputs.asset_name }}
          UPSTREAM_NOTES: ${{ steps.release.outputs.notes }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "Upstream release: https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${UPSTREAM_TAG}"
            echo "Upstream asset: \`${UPSTREAM_ASSET}\`"
            echo
            echo "## Upstream Release Notes"
            echo "$UPSTREAM_NOTES"
          } > RELEASE_NOTES.md

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$MIRROR_TAG" "$OUTPUT_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$MIRROR_TAG" \
              --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
          else
            gh release create "$MIRROR_TAG" "$OUTPUT_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "${APP_NAME} v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi

  update-source:
    needs: [prepare, mirror]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Update and validate source
        run: |
          git pull --rebase origin main
          uv run --locked --no-dev python update.py
          uv run --locked --no-dev python update.py --validate-only
          jq empty app.json

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "chore: update source"
          git push origin HEAD:main
